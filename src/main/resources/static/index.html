<!DOCTYPE html>
<html>
<head>
    <title>Nexus Enterprise IT Support</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #F9FAFB; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #4F46E5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nexus Enterprise</h1>
        <p>This is the Java backend running in STS.</p>
        <p>To run the <strong>React Dashboard</strong> locally:</p>
        <ol style="text-align: left; display: inline-block;">
            <li>Install Node.js</li>
            <li>Run <code>npm install</code> in the project root</li>
            <li>Run <code>npm run dev</code></li>
            <li>Visit <code>http://localhost:3000</code></li>
        </ol>
        <p>The Java API is active at <code>http://localhost:8080/api/tickets</code></p>
    </div>
</body>
</html>
