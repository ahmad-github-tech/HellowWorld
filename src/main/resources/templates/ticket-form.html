<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>IT Support - New Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <a href="/tickets" class="text-xs font-bold text-slate-400 uppercase tracking-widest hover:text-indigo-600 transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Back to Tickets
                </a>
                <h1 class="text-3xl font-bold text-slate-900 mt-2" th:text="${ticket.id == null or ticket.id == '' ? 'Create New IT Ticket' : 'Update Ticket #' + ticket.id}"></h1>
            </div>
        </div>

        <form th:action="@{/tickets/save}" method="post" th:object="${ticket}" class="grid grid-cols-1 lg:grid-cols-3 gap-8" onsubmit="return confirm('Do you want to save this ticket record?')">
            <input type="hidden" th:field="*{id}">

            <!-- Main Info (Left Col) -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-900 mb-6 flex items-center gap-2 border-b pb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                        Ticket Details
                    </h2>

                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Ticket ID</label>
                                <input th:value="${(ticket.id == null or ticket.id == '') ? 'TICKET-(Auto)' : '#' + ticket.id}" disabled class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-500 font-mono outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Status</label>
                                <select th:field="*{status}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none cursor-pointer focus:ring-2 ring-indigo-500">
                                    <option value="Open">Open</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Hold">Hold</option>
                                    <option value="Resolved">Resolved</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Short Summary / Title</label>
                            <input th:field="*{title}" placeholder="e.g., VPN connection failure on remote workstations" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:ring-2 ring-indigo-500 outline-none transition-all">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Detailed Description</label>
                            <textarea th:field="*{description}" placeholder="Provide as much detail as possible..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm h-40 resize-none outline-none focus:bg-white focus:ring-2 ring-indigo-500 transition-all"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Meta Data (Right Col) -->
            <div class="space-y-6">
                <!-- Status/Meta -->
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-900 mb-6 uppercase tracking-widest border-b pb-4">Classification</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-500 mb-1 block">Project / Department</label>
                            <select th:field="*{projectId}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none cursor-pointer focus:ring-2 ring-indigo-500">
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 mb-1 block">Ticket Type</label>
                            <select th:field="*{ticketType}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none cursor-pointer focus:ring-2 ring-indigo-500">
                                <option value="Incident">Incident</option>
                                <option value="Service Request">Service Request</option>
                                <option value="Problem">Problem</option>
                                <option value="Change Request">Change Request</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 mb-1 block">Ticket Category</label>
                            <select th:field="*{ticketCategory}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none cursor-pointer focus:ring-2 ring-indigo-500">
                                <option value="L1">Level 1 (Basic)</option>
                                <option value="L2">Level 2 (Advanced)</option>
                                <option value="L3">Level 3 (Specialist)</option>
                                <option value="L4">Level 4 (Architect/Vendor)</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 mb-1 block">Priority Level</label>
                            <select th:field="*{priority}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none cursor-pointer focus:ring-2 ring-indigo-500">
                                <option value="Low">Low (P4)</option>
                                <option value="Medium">Medium (P3)</option>
                                <option value="High">High (P2)</option>
                                <option value="Critical">Critical (P1)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Timestamps -->
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-900 mb-6 uppercase tracking-widest border-b pb-4">Timeline</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-500 mb-1 block">Creation Date</label>
                            <input type="datetime-local" th:field="*{createdAt}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-indigo-500">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 mb-1 block">Expected Response</label>
                            <input type="datetime-local" th:field="*{responseDateTime}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-indigo-500">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 mb-1 block">Target Resolution</label>
                            <input type="datetime-local" th:field="*{resolutionDateTime}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-indigo-500">
                        </div>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-900 mb-6 uppercase tracking-widest border-b pb-4">Internal Notes</h2>
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1 block">Remarks</label>
                        <textarea th:field="*{remarks}" placeholder="Enter any specific remarks here..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm h-24 resize-none outline-none focus:bg-white focus:ring-2 ring-indigo-500 transition-all"></textarea>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-sm shadow-xl shadow-indigo-100 hover:bg-indigo-700 hover:-translate-y-1 transition-all active:translate-y-0">
                        Save Ticket Record
                    </button>
                    <p class="text-[10px] text-center text-slate-400 mt-4 uppercase tracking-widest font-medium">System will audit this entry</p>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
