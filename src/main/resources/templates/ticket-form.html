<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexus IT Support - Ticket Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-indigo-600 flex items-center justify-center min-h-screen p-6">
    <div class="bg-white max-w-xl w-full rounded-[2rem] overflow-hidden shadow-2xl">
        <div class="p-10 border-b">
            <a href="/tickets" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 hover:text-indigo-600 block transition-colors">← Back to Records</a>
            <h2 class="text-3xl font-bold" th:text="${ticket.id == null or ticket.id == '' ? 'Log New Request' : 'Modify Record #' + ticket.id}"></h2>
            <p class="text-sm text-slate-400 mt-2">Initiate a synchronization between the user and support node.</p>
        </div>

        <form action="/tickets/save" method="post" th:object="${ticket}" class="p-10 space-y-6">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{status}">

            <div>
                <label class="text-[10px] font-bold uppercase text-slate-400 mb-1 block">Subject Identification</label>
                <input th:field="*{title}" required class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm focus:bg-white focus:ring-2 ring-indigo-500 outline-none transition-all">
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 mb-1 block">Context Cluster</label>
                    <select th:field="*{projectId}" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm outline-none cursor-pointer">
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 mb-1 block">Urgency Node</label>
                    <select th:field="*{priority}" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm outline-none cursor-pointer">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold uppercase text-slate-400 mb-1 block">Detailed Brief</label>
                <textarea th:field="*{description}" required class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm h-32 resize-none outline-none focus:bg-white focus:ring-2 ring-indigo-500 transition-all"></textarea>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-sm shadow-xl shadow-indigo-100 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all active:translate-y-0">
                Commit Entry
            </button>
        </form>
    </div>
</body>
</html>
